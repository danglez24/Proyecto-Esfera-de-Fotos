<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Pro - Interfaz Limpia</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #portfolio-header {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; padding: 0 20px; pointer-events: none;
        }
        #portfolio-header h1 { margin: 0; font-size: 24px; font-weight: normal; letter-spacing: 2px; }
        
        #portfolio-nav { pointer-events: auto; display: flex; align-items: center; font-size: 14px;}
        
        #upload-btn { 
            color: #fff; font-weight: bold; border-bottom: 1px solid white; 
            padding-bottom: 2px; cursor: pointer; transition: opacity 0.3s;
        }
        #upload-btn:hover { opacity: 0.7; }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 5; pointer-events: none; mix-blend-mode: difference;
        }

        #ui-hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3); font-size: 12px; letter-spacing: 1px; 
            backdrop-filter: blur(5px); display: none; z-index: 10;
        }

        #instructions {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; z-index: 20;
        }

        #pause-upload-btn {
            margin-top: 30px; padding: 12px 24px; background: white; color: black;
            border: none; border-radius: 4px; font-weight: bold; cursor: pointer;
            font-size: 14px; letter-spacing: 1px; transition: background 0.3s;
        }
        #pause-upload-btn:hover { background: #ddd; }
    </style>
</head>
<body>
    <div id="portfolio-header">
        <h1>MARK CLENNON</h1>
        <div id="portfolio-nav">
            <a id="upload-btn">UPLOAD</a>
            <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
        </div>
    </div>
    <div id="crosshair"></div>
    <div id="ui-hint">PRESIONA [ X ] PARA SALIR DEL ENFOQUE</div>
    <div id="canvas-container"></div>
    <div id="instructions">
        <h2 style="font-weight: normal; margin-bottom: 10px;">ENTRAR AL PORTAFOLIO</h2>
        <p style="color:#888; margin-bottom: 20px;">[WASD] Mover | [Apuntar] Destacar | [Click] Enfocar | [ESC] Pausa</p>
        <button id="pause-upload-btn">SUBIR MIS FOTOS</button>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        let globeGroup;
        let raycaster = new THREE.Raycaster();
        let crosshairPoint = new THREE.Vector2(0, 0);

        let hoveredObject = null;
        let isFocused = false;
        let focusTarget = null;
        const uiHint = document.getElementById('ui-hint');

        const globeRadius = 35;
        
        // Imágenes iniciales por defecto
        let imageUrls = [
            'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&q=75',
            'https://images.unsplash.com/photo-1521119989659-a83eee488004?w=400&q=75',
            'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&q=75',
            'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=400&q=75'
        ];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            const instructions = document.getElementById('instructions');
            
            instructions.addEventListener('click', () => {
                if(!isFocused) controls.lock();
            });
            controls.addEventListener('lock', () => instructions.style.display = 'none');
            controls.addEventListener('unlock', () => { if(!isFocused) instructions.style.display = 'flex'; });
            scene.add(controls.getObject());

            // Listeners para subida de archivos
            const uploadBtn = document.getElementById('upload-btn');
            const pauseUploadBtn = document.getElementById('pause-upload-btn');
            const fileInput = document.getElementById('file-input');

            uploadBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
            pauseUploadBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });

            fileInput.addEventListener('change', handleFileUpload);

            document.addEventListener('keydown', (e) => {
                onKeyDown(e);
                if(e.code === 'KeyX' && isFocused) exitFocus();
            });
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseClick);

            createGlobe(imageUrls);

            window.addEventListener('resize', onWindowResize);
        }

        function createGlobe(urls) {
            if(globeGroup) scene.remove(globeGroup);
            
            globeGroup = new THREE.Group();
            const textureLoader = new THREE.TextureLoader();
            const loadedTextures = urls.map(url => textureLoader.load(url));
            const imageGeo = new THREE.PlaneGeometry(4, 5.5);

            let globalIndex = 0; 
            const numRows = 12;
            const baseCols = 28; // Columnas en el ecuador

            for (let i = 0; i < numRows; i++) {
                // Latitud
                const phi = ((i + 1) / (numRows + 1)) * Math.PI;
                
                // Reducción armónica en los polos
                const currentCols = Math.max(6, Math.round(baseCols * Math.sin(phi)));

                for (let j = 0; j < currentCols; j++) {
                    // Longitud
                    const theta = (j / currentCols) * 2 * Math.PI;
                    
                    const x = globeRadius * Math.sin(phi) * Math.cos(theta);
                    const y = globeRadius * Math.cos(phi);
                    const z = globeRadius * Math.sin(phi) * Math.sin(theta);

                    const material = new THREE.MeshBasicMaterial({
                        map: loadedTextures[globalIndex % loadedTextures.length],
                        transparent: true, opacity: 1, side: THREE.DoubleSide
                    });

                    const mesh = new THREE.Mesh(imageGeo, material);
                    mesh.position.set(x, y, z);
                    mesh.lookAt(0,0,0);
                    mesh.rotateY(Math.PI);
                    
                    mesh.userData.originalPos = mesh.position.clone();
                    globeGroup.add(mesh);
                    globalIndex++;
                }
            }
            scene.add(globeGroup);
        }

        function handleFileUpload(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            const newUrls = [];
            for (let i = 0; i < files.length; i++) {
                const objectUrl = URL.createObjectURL(files[i]);
                newUrls.push(objectUrl);
            }

            const textureLoader = new THREE.TextureLoader();
            const newTextures = newUrls.map(url => textureLoader.load(url));

            let meshIndex = 0;
            globeGroup.children.forEach(mesh => {
                const texIndex = meshIndex % newTextures.length;
                mesh.material.map = newTextures[texIndex];
                mesh.material.needsUpdate = true;
                meshIndex++;
            });

            setTimeout(() => controls.lock(), 500); 
        }

        function onMouseClick() {
            if (!controls.isLocked || isFocused) return;
            
            if (hoveredObject) {
                isFocused = true;
                focusTarget = hoveredObject;
                controls.unlock(); 
                uiHint.style.display = 'block';

                globeGroup.children.forEach(mesh => {
                    mesh.material.opacity = (mesh === focusTarget) ? 1 : 0.4;
                });
            }
        }

        function exitFocus() {
            isFocused = false;
            focusTarget = null;
            uiHint.style.display = 'none';
            
            if (hoveredObject) {
                hoveredObject.position.copy(hoveredObject.userData.originalPos);
                hoveredObject.scale.set(1, 1, 1);
                hoveredObject = null;
            }
            
            globeGroup.children.forEach(mesh => mesh.material.opacity = 1);
            controls.lock();
        }

        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            globeGroup.rotation.y += 0.0005;

            // Hover (Destacar)
            if (controls.isLocked && !isFocused) {
                raycaster.setFromCamera(crosshairPoint, camera);
                const intersects = raycaster.intersectObjects(globeGroup.children);

                if (intersects.length > 0) {
                    const intersect = intersects[0].object;
                    if (hoveredObject !== intersect) {
                        if (hoveredObject) {
                            hoveredObject.position.copy(hoveredObject.userData.originalPos);
                            hoveredObject.scale.set(1, 1, 1);
                        }
                        hoveredObject = intersect;
                        hoveredObject.translateZ(3); 
                        hoveredObject.scale.set(1.3, 1.3, 1); 
                        globeGroup.children.forEach(mesh => {
                            mesh.material.opacity = (mesh === hoveredObject) ? 1 : 0.6;
                        });
                    }
                } else {
                    if (hoveredObject) {
                        hoveredObject.position.copy(hoveredObject.userData.originalPos);
                        hoveredObject.scale.set(1, 1, 1);
                        hoveredObject = null;
                        globeGroup.children.forEach(mesh => mesh.material.opacity = 1);
                    }
                }
            }

            // Enfoque / Movimiento
            if (isFocused && focusTarget) {
                const targetWorldPos = new THREE.Vector3();
                focusTarget.getWorldPosition(targetWorldPos);

                const directionToPhoto = targetWorldPos.clone().normalize();
                const idealCamPos = directionToPhoto.multiplyScalar(globeRadius + 18);

                camera.position.lerp(idealCamPos, 0.08);
                camera.lookAt(targetWorldPos);

            } else if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 180.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 180.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                const dist = camera.position.length();
                if(dist < 40 || dist > 150) velocity.set(0,0,0);
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
